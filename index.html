<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - 戦国放置RPG</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .news-box { background: #222; border: 1px solid #444; padding: 10px; margin-bottom: 20px; border-radius: 4px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-btn { background: #333; color: #fff; padding: 20px; text-align: center; text-decoration: none; border: 1px solid #555; border-radius: 8px; font-weight: bold; display: block; transition: background 0.2s; }
        .menu-btn:hover { background: #444; }
        .menu-icon { font-size: 2rem; display: block; margin-bottom: 5px; }
        
        /* モーダル用 */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; }
        .modal-content { background:#222; border:2px solid #d4af37; padding:20px; width:90%; max-width:400px; border-radius:8px; text-align:center; color:#ccc; }
        textarea { width: 90%; height: 100px; background:#111; color:#fff; border:1px solid #555; margin-bottom:10px; padding:5px; }
    </style>
</head>
<body>

<header><h1>戦国放置RPG</h1></header>

<div class="container">
    <div class="news-box">
        <div style="color:#d4af37; font-weight:bold; margin-bottom:5px;">◆ お知らせ</div>
        <div style="font-size:0.85rem; line-height:1.5;">
            ・万屋（ショップ）がオープンしました！<br>
            ・進軍速度の変更機能を追加しました。<br>
            ・一部武将のスキルバランスを調整しました。
        </div>
    </div>

    <div class="menu-grid">
        <a href="battle.html" class="menu-btn" style="border-color:#d4af37; background:#332200;">
            <span class="menu-icon">⚔️</span>
            出陣
        </a>
        <a href="deck.html" class="menu-btn">
            <span class="menu-icon">🏯</span>
            編成
        </a>
        <a href="gacha.html" class="menu-btn">
            <span class="menu-icon">🎫</span>
            登用
        </a>
        <a href="shop.html" class="menu-btn">
            <span class="menu-icon">💰</span>
            万屋
        </a>
        <a href="book.html" class="menu-btn">
            <span class="menu-icon">📜</span>
            名鑑
        </a>
    </div>

    <div style="margin-top:30px; text-align:center;">
        <button onclick="document.getElementById('transfer-modal').style.display='flex'" style="background:#444; border:1px solid #666; font-size:0.8rem; padding:8px 15px;">データ引き継ぎ</button>
        <button onclick="performReset()" style="background:#522; border:1px solid #844; color:#fcc; font-size:0.8rem; padding:8px 15px; margin-left:10px;">データ初期化</button>
    </div>
</div>

<div id="transfer-modal" class="modal">
    <div class="modal-content">
        <h3>データ引き継ぎ</h3>
        <p style="font-size:0.8rem;">機種変更などの際に使用してください。<br>（万屋の実装によりデータ構造が変わっていますが、旧データも読み込み可能です）</p>
        
        <div style="text-align:left; font-size:0.8rem; color:#d4af37;">あなたのID (コピー用)</div>
        <textarea id="export-area" readonly></textarea>
        <button onclick="copyCode()" style="margin-bottom:15px;">コピーする</button>

        <div style="text-align:left; font-size:0.8rem; color:#d4af37; border-top:1px solid #444; padding-top:10px;">データを復元 (貼り付け)</div>
        <textarea id="import-area" placeholder="ここにコードを貼り付け"></textarea>
        <button onclick="loadCode()" style="background:#d4af37; color:#000;">復元する</button>
        
        <button onclick="closeTransferModal()" style="margin-top:15px; background:#444;">閉じる</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="active">ホーム</a>
    <a href="deck.html">編成</a>
    <a href="battle.html">出陣</a>
    <a href="gacha.html">ガチャ</a>
</nav>

<script src="character_data.js"></script>
<script src="quest_data.js"></script>
<script src="game_core.js"></script>

<script>
    // データ初期化チェック
    if(typeof loadSaveData === 'function') {
        const data = loadSaveData();
        if(document.getElementById('export-area')) {
            document.getElementById('export-area').value = exportSaveData();
        }
    }

    function closeTransferModal() {
        document.getElementById('transfer-modal').style.display = 'none';
    }

    function copyCode() {
        const copyText = document.getElementById("export-area");
        copyText.select();
        document.execCommand("copy"); 
        if(navigator.clipboard) navigator.clipboard.writeText(copyText.value);
        alert("コードをコピーしました！");
    }

    function loadCode() {
        const code = document.getElementById("import-area").value;
        if(!code) return;
        if(confirm("現在のデータを上書きして復元しますか？\n(今のデータは消えます)")) {
            const success = importSaveData(code);
            if(success) { alert("復元に成功しました！"); location.reload(); }
            else alert("コードが間違っているか、壊れています。");
        }
    }

    function performReset() {
        if(confirm("本当にデータを初期化しますか？\nこの操作は取り消せません。\n(所持金や武将など全てのデータが消えます)")) {
            if(confirm("本当に削除してよろしいですか？")) {
                resetSaveData();
                alert("データを初期化しました。");
                location.reload();
            }
        }
    }
    
    window.onload = function() {
        if(typeof checkAndDistributeStarter === 'function') {
            const res = checkAndDistributeStarter();
            if (res.success) { alert(`【初期特典】「${res.rarity}${res.name}」を獲得しました！`); }
        }
    };
</script>
</body>
</html>
