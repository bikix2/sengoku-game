<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出陣 - 戦国放置RPG</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- 基本レイアウト --- */
        .log-area { background: #111; padding: 15px; height: 380px; overflow-y: scroll; font-family: monospace; font-size: 0.85rem; color: #ccc; border: 1px solid #444; line-height: 1.6; }
        .log-line { margin-bottom: 6px; border-bottom: 1px dashed #222; padding-bottom: 2px; }
        .ev-battle { color: #fa8; font-weight: bold; border-left: 3px solid #fa8; padding-left: 5px; background: rgba(60, 30, 0, 0.5); display:block; margin:5px 0;}
        .ev-bad { color: #f66; font-weight:bold; } .ev-good { color: #6f6; font-weight:bold; }
        .ev-skill { color: #6cf; font-weight:bold; } .ev-reflect { color: #f0f; font-weight:bold; background:#202; padding:0 4px; }
        .ev-critical { color: #ff0; font-weight:bold; text-shadow: 0 0 5px #f00; font-size: 1.1rem; } 
        .ev-fate { display:block; color:#fff; background: linear-gradient(90deg, #500, #900, #500); border:1px solid #d4af37; padding:5px; text-align:center; font-weight:bold; margin:5px 0; border-radius:4px; box-shadow: 0 0 5px #f00; }
        
        .region-header { background: #333; color: #aaa; padding: 5px 10px; font-size: 0.85rem; margin-top: 15px; margin-bottom: 5px; border-left: 4px solid #d4af37; font-weight: bold; }
        .quest-badges { font-size:0.7rem; margin-top:3px; }
        .badge { display:inline-block; padding:1px 4px; border-radius:3px; margin-right:4px; border:1px solid #555; }
        .badge-danger { color:#f55; border-color:#f55; background:#200; }
        .badge-weather { color:#aad; border-color:#aad; }
        .badge-new { background: linear-gradient(135deg, #d00, #f00); color: #fff; font-weight: bold; border: 1px solid #faa; text-shadow: 0 0 2px #000; margin-left: 5px; font-size: 0.7rem; }
        
        .s-cond { font-size: 0.75rem; color: #aaa; margin-top: 2px; }
        .s-cond-ok { color: #0f0; font-weight: bold; }
        .s-mark { color: #ffd700; font-weight: bold; margin-right: 5px; text-shadow: 0 0 3px #d4af37; }

        /* --- UIパーツ --- */
        .bulk-controls { display: flex; gap: 5px; margin-bottom: 10px; padding: 10px; background: #222; border-bottom: 1px solid #444; }
        .btn-bulk { padding: 8px; font-size: 0.8rem; cursor: pointer; border-radius: 4px; border: 1px solid #666; background: #333; color: #fff; flex:1; }
        .btn-bulk-sell { background: #522; border-color: #844; color: #fcc; flex: 2; font-weight: bold; }
        .prisoner-row { display:flex; align-items:center; border-bottom:1px solid #444; padding: 8px; justify-content: space-between; background: #1a1a1a; }
        .prisoner-check { transform: scale(1.5); margin-right: 15px; cursor: pointer; }
        .prisoner-thumb { width: 45px; height: 45px; object-fit: cover; border: 1px solid #555; margin-right: 10px; }
        
        /* モーダル共通スタイル（拡張版） */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; }
        .modal-content { 
            background: #222; border: 2px solid #d4af37; 
            padding: 15px; width: 95%; max-width: 500px; 
            max-height: 90vh; overflow-y: auto;
            border-radius: 8px; text-align: center; color: #ccc; 
        }
        .large-char-img { max-width: 250px; width: 80%; border: 3px solid #555; margin: 10px auto; display: block; box-shadow: 0 0 10px #000; }
        .status-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.9rem; }
        .status-table th { background: #333; color: #aaa; padding: 5px; border: 1px solid #444; width: 25%; }
        .status-table td { background: #1a1a1a; padding: 5px; border: 1px solid #444; color: #fff; }
        .skill-box { background: #332200; border: 1px solid #d4af37; padding: 10px; margin-bottom: 15px; text-align: left; border-radius: 4px; }
        .profile-box { font-size: 0.85rem; color: #aaa; text-align: left; padding: 10px; background: #111; border: 1px solid #333; margin-bottom: 10px; line-height: 1.5; }

        .btn-act { width:100%; padding:12px; margin-top:8px; border:none; cursor:pointer; font-weight:bold; border-radius:4px; font-size:0.95rem; }
        .btn-key { background: #d4af37; color:#000; box-shadow:0 2px 0 #886622; }
        .btn-coin { background: #446; color:#fff; border:1px solid #668; box-shadow:0 2px 0 #224; }
        .btn-close { background: #444; color: #fff; border: 1px solid #666; margin-top: 15px; }
        .debug-btn { margin-top:10px; background:#444; color:#ccc; border:1px solid #666; padding:5px; }
        
        .resource-bar { display:flex; justify-content:space-around; background:#111; padding:5px; border-bottom:1px solid #444; font-size:0.9rem; color:#ccc; }
        .res-icon { color:#ffd700; margin-right:3px; }
        .tactic-select-box { background:#223; padding:10px; border-bottom:1px solid #445; display:flex; align-items:center; justify-content:space-between; }
        .tactic-select-box select { background:#111; color:#fff; border:1px solid #555; padding:5px; flex:1; margin-left:10px; }
        
        .ach-item { border-bottom:1px solid #444; padding:8px; text-align:left; }
        .ach-name { color:#d4af37; font-weight:bold; }
        .ach-cond { font-size:0.8rem; color:#888; }
        .ach-reward { font-size:0.8rem; color:#8f8; }

        .r-UR { color: #f0f; font-weight:bold; } .r-SSR { color: #ffd700; font-weight:bold; } 
        .r-SR { color: #c0c0c0; font-weight:bold; } .r-R { color: #d94; font-weight:bold; }
        
        .treasure-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap:5px; padding:10px; }
        .treasure-item { background:#111; border:1px solid #333; padding:5px; text-align:center; font-size:0.75rem; border-radius:4px; }
        .tr-unlocked { border-color:#d4af37; color:#fff; background: #332200; }
        .tr-rank { color:#ffd700; font-weight:bold; }

        /* Speed Selection Styles */
        .speed-box { background: #1a1a1a; padding:10px; border-bottom: 1px solid #444; }
        .speed-options { display: flex; gap: 5px; margin-top: 5px; }
        .speed-option-label { 
            flex: 1; text-align: center; border: 1px solid #444; background: #222; 
            padding: 8px 5px; border-radius: 4px; cursor: pointer; position: relative;
        }
        .speed-option-label input { position: absolute; opacity: 0; }
        .speed-option-label:has(input:checked) {
            border-color: #d4af37; background: #332200; color: #d4af37;
        }
        .speed-title { font-weight: bold; font-size: 0.9rem; }
        .speed-sub { font-size: 0.7rem; color: #aaa; }
        #speed-desc-area { font-size: 0.8rem; color: #ccc; margin-top: 8px; padding: 5px; background: #111; border-radius: 3px; min-height: 2.5em; display:flex; align-items:center; }
        .warn-text { color: #f66; font-weight: bold; }

        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-anim { animation: shake 0.5s; animation-iteration-count: 1; }

        @keyframes flash {
            0% { background-color: transparent; }
            50% { background-color: rgba(255, 255, 255, 0.5); }
            100% { background-color: transparent; }
        }
        .flash-anim { animation: flash 0.5s; }

        .cut-in-active { animation: fadeInOut 2.5s ease-in-out forwards; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1.1); }
            80% { opacity: 1; transform: scale(1.0); }
            100% { opacity: 0; transform: scale(1.2); }
        }
    </style>
</head>
<body>

<header><h1>戦況報告</h1></header>

<div id="error-display" style="display:none; color:#f55; background:#300; padding:10px; margin:5px; border:1px solid #f00; font-weight:bold;"></div>

<div class="resource-bar">
    <div><span class="res-icon">💰</span><span id="money-disp">0</span></div>
    <div><span class="res-icon">🎫</span><span id="ticket-disp">0</span></div>
    <div><span class="res-icon">🗝️</span><span id="kokoro-disp">0</span></div>
</div>

<div id="cut-in-overlay">
    <div id="cut-in-text">SKILL NAME</div>
    <div id="cut-in-sub">CHARACTER NAME</div>
</div>

<div class="container">
    <div style="display:flex; justify-content:center; margin-bottom:10px;">
        <button onclick="switchTab('quest')" style="flex:1;">出陣</button>
        <button onclick="switchTab('prisoner')" style="flex:1;">捕虜蔵</button>
    </div>

    <div id="tab-quest">
        <div id="scene-select">
            
            <div class="tactic-select-box">
                <span style="font-size:0.9rem; font-weight:bold;">戦術:</span>
                <select id="tactic-select"></select>
            </div>

            <div class="speed-box">
                <div style="font-size:0.9rem; font-weight:bold; color:#d4af37;">進軍速度</div>
                <div class="speed-options">
                    <label class="speed-option-label">
                        <input type="radio" name="march-speed" value="normal" checked onchange="updateSpeedDesc()">
                        <div class="speed-title">通常</div>
                        <div class="speed-sub">標準</div>
                    </label>
                    <label class="speed-option-label">
                        <input type="radio" name="march-speed" value="fast" onchange="updateSpeedDesc()">
                        <div class="speed-title">かけあし</div>
                        <div class="speed-sub">早・糧増</div>
                    </label>
                    <label class="speed-option-label">
                        <input type="radio" name="march-speed" value="blitz" onchange="updateSpeedDesc()">
                        <div class="speed-title" style="color:#f88;">電撃強行</div>
                        <div class="speed-sub">即・難</div>
                    </label>
                </div>
                <div id="speed-desc-area">
                    標準的な速度です。兵糧消費も標準です。
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; padding:5px; background:#222; margin-bottom:5px;">
                <button onclick="openAchModal()" style="flex:1; margin-right:5px; padding:5px; font-size:0.8rem; background:#444; color:#fff; border:1px solid #666;">🏆 実績</button>
                <button onclick="openTreasureModal()" style="flex:1; margin-left:5px; padding:5px; font-size:0.8rem; background:#446; color:#fff; border:1px solid #668;">🍵 家宝一覧</button>
            </div>
            
            <p style="font-size:0.8rem; color:#aaa; text-align:center;">
                S評価条件: 勝利 + 死者0 + 兵力70% + <span style="color:#d4af37;">指定武将</span><br>
                (S評価で「ココロの鍵」獲得のチャンス！)
            </p>
            <div id="quest-list"></div>
            
            <div style="margin-top: 20px; text-align:right;">
                <span id="admin-indicator" style="display:none; color:red; font-weight:bold; margin-right:10px;">【管理者モード中】</span>
                <a href="#" onclick="toggleAdminMode()" style="color:#666; font-size:0.8rem;">管理者設定</a>
            </div>
        </div>

        <div id="scene-progress" style="display:none;">
            <div id="battle-box" class="box" style="text-align:center; border-color:#d4af37;">
                <h3 id="quest-title" style="margin:0; color:#d4af37;">進軍中</h3>
                <div id="speed-indicator" style="font-size:0.8rem; margin-top:2px;"></div>
                <div id="weather-info" style="font-size:0.8rem; margin:5px 0;"></div>
                <div id="timer" style="font-size:1.5rem; font-weight:bold; color:#f55;">00:00</div>
                <div id="log-container" class="log-area"></div>
                
                <button id="btn-finish" onclick="finishExpedition()" style="display:none; width:100%; margin-top:10px; padding:10px; background:#d4af37; color:#000; font-weight:bold;">戦果を確認する</button>
                
                <button id="btn-retreat" onclick="doRetreat()" style="width:100%; margin-top:10px; padding:10px; background:#522; color:#fcc; font-weight:bold; border:1px solid #844;">全軍撤退する</button>

                <div id="admin-controls" style="display:none;">
                    <button onclick="debugSkip()" class="debug-btn">🛠️ 早期終了 (Debug)</button>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-prisoner" style="display:none;">
        <div class="box">
            <h3>捕らえた武将</h3>
            <div class="bulk-controls">
                <button class="btn-bulk" onclick="setAllChecks(true)">全選択</button>
                <button class="btn-bulk" onclick="setAllChecks(false)">全解除</button>
                <button class="btn-bulk btn-bulk-sell" onclick="bulkRelease()">選択を一括解放</button>
            </div>
            <div id="prisoner-list"></div>
        </div>
    </div>
</div>

<div id="prisoner-modal" class="modal">
    <div class="modal-content" id="prisoner-modal-content">
        </div>
</div>

<div id="ach-modal" class="modal">
    <div class="modal-content">
        <h3 style="color:#d4af37; border-bottom:1px solid #444; padding-bottom:5px;">実績</h3>
        <div id="ach-list" style="max-height:300px; overflow-y:auto; text-align:left;"></div>
        <button class="btn-act btn-close" onclick="document.getElementById('ach-modal').style.display='none'">閉じる</button>
    </div>
</div>

<div id="treasure-modal" class="modal">
    <div class="modal-content">
        <h3 style="color:#d4af37; border-bottom:1px solid #444; padding-bottom:5px;">家宝一覧</h3>
        <div id="treasure-status" style="font-size:0.85rem; margin-bottom:10px;"></div>
        <div id="treasure-list" class="treasure-grid" style="max-height:400px; overflow-y:auto;"></div>
        <button class="btn-act btn-close" onclick="document.getElementById('treasure-modal').style.display='none'">閉じる</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html">ホーム</a>
    <a href="deck.html">編成</a>
    <a href="battle.html" class="active">出陣</a>
    <a href="gacha.html">ガチャ</a>
</nav>

<script src="character_data.js"></script>
<script src="quest_data.js"></script> <script src="game_core.js"></script>
<script>
    let currentSave = null;
    let timerId = null;
    let selectedPrisonerIndex = -1;
    let lastLogIndex = 0; 
    let isAdminMode = false; // 管理者モードフラグ

    // エラーハンドリング（安全対策）
    window.onload = function() {
        const errorDiv = document.getElementById('error-display');
        let errorMsg = "";

        if (typeof QUEST_DATA === 'undefined') {
            errorMsg += '【エラー】プログラム(game_core.js)が正しく読み込まれていません。<br>' +
                        'QUEST_DATAが見つかりません。<br>';
        }

        if (errorMsg) {
            errorDiv.innerHTML = errorMsg;
            errorDiv.style.display = 'block';
            document.getElementById('quest-list').innerHTML = 
                '<div style="color:#f55; background:#300; padding:20px; border:1px solid #f00;">' +
                'データの読み込みに失敗しました。画面上部のエラーを確認してください。' +
                '</div>';
            return;
        }

        try {
            if (typeof loadSaveData !== 'function') {
                throw new Error("loadSaveData関数が見つかりません。game_core.jsを確認してください。");
            }
            currentSave = loadSaveData();
        } catch(e) {
            alert("セーブデータの読み込みに失敗しました。\n" + e);
            errorDiv.innerHTML += "Save Load Error: " + e.message + "<br>";
            errorDiv.style.display = 'block';
            return;
        }

        if(typeof checkAndDistributeStarter === 'function') {
            const res = checkAndDistributeStarter();
            if (res.success) {
                alert(`【初期特典】「${res.rarity}${res.name}」を獲得しました！`);
                currentSave = loadSaveData(); 
            }
        }

        if (currentSave.last_setup) {
            if (currentSave.last_setup.tactic) {
                setTimeout(() => { 
                    const sel = document.getElementById('tactic-select');
                    if (sel) sel.value = currentSave.last_setup.tactic;
                }, 100);
            }
            if (currentSave.last_setup.speed) {
                const radios = document.getElementsByName('march-speed');
                for(let r of radios) {
                    if (r.value === currentSave.last_setup.speed) r.checked = true;
                }
            }
        }

        updateResourceDisplay();
        renderTacticSelect(); 
        updateSpeedDesc(); 
        
        if(currentSave.expedition) { switchTab('quest'); resumeExpedition(); }
        else { renderQuestList(); renderPrisoners(); }
    };

    function updateResourceDisplay() {
        if(!currentSave) return;
        document.getElementById('money-disp').textContent = (currentSave.money || 0).toLocaleString();
        document.getElementById('ticket-disp').textContent = (currentSave.items.ticket || 0).toLocaleString();
        document.getElementById('kokoro-disp').textContent = (currentSave.items.kokoro || 0).toLocaleString();
    }

    function renderTacticSelect() {
        if(!currentSave) return;
        const sel = document.getElementById('tactic-select');
        sel.innerHTML = '<option value="">(戦術なし)</option>';
        if (currentSave.tactics) {
            currentSave.tactics.forEach(tName => {
                const tData = TACTICS_DATA.find(t => t.name === tName);
                if (tData) {
                    const opt = document.createElement('option');
                    opt.value = tName;
                    opt.textContent = tName + (tData.desc ? ` (${tData.desc})` : "");
                    sel.appendChild(opt);
                }
            });
        }
    }

    function updateSpeedDesc() {
        const els = document.getElementsByName('march-speed');
        let val = 'normal';
        for(let i=0; i<els.length; i++) { if(els[i].checked) val = els[i].value; }
        
        const descArea = document.getElementById('speed-desc-area');
        
        if (typeof MARCH_SPEEDS !== 'undefined' && MARCH_SPEEDS[val]) {
            const s = MARCH_SPEEDS[val];
            if (val === 'blitz') {
                descArea.innerHTML = `<span class='warn-text'>【危険】即座に結果が出ますが、兵糧消費${s.foodMod}倍、敵ステータス${s.diffMod}倍に強化されます。</span><br>実績「天下覇王」対象。`;
            } else if (val === 'fast') {
                descArea.innerHTML = `時間は<span style='color:#fd0'>半分</span>で済みますが、兵糧消費が<span style='color:#f88'>${s.foodMod}倍</span>になります。<br>実績「天下無敵」対象。`;
            } else {
                descArea.innerHTML = "標準的な速度です。兵糧消費も標準です。";
            }
        }
    }

    function switchTab(tab) {
        document.getElementById('tab-quest').style.display = (tab==='quest') ? 'block' : 'none';
        document.getElementById('tab-prisoner').style.display = (tab==='prisoner') ? 'block' : 'none';
        if(tab==='prisoner') renderPrisoners();
    }

    function toggleAdminMode() {
        if (isAdminMode) {
            isAdminMode = false;
            alert("通常モードに戻りました。");
        } else {
            const pass = prompt("管理者パスワードを入力してください");
            if (pass === "1651") {
                isAdminMode = true;
                alert("管理者モードになりました。\n・全ステージ開放\n・早期終了可能");
            } else {
                alert("パスワードが違います。");
            }
        }
        document.getElementById('admin-indicator').style.display = isAdminMode ? 'inline' : 'none';
        renderQuestList();
        if (document.getElementById('scene-progress').style.display === 'block') {
            document.getElementById('admin-controls').style.display = isAdminMode ? 'block' : 'none';
        }
    }

    function renderQuestList() {
        const list = document.getElementById('quest-list'); list.innerHTML = '';
        if(!currentSave) return;

        let lastRegion = "";
        const ownedKeys = currentSave.owned_ids.map(id => { const c = getCharacterById(id); return c ? (c.rarity + c.name) : ""; });
        
        try {
            if (!QUEST_DATA || QUEST_DATA.length === 0) {
                throw new Error("QUEST_DATA is empty");
            }

            let prevQuestId = null;

            QUEST_DATA.forEach((q, index) => {
                let isLocked = true;
                if (q.region === "イベント") {
                    isLocked = false;
                } else {
                    if (prevQuestId === null) {
                        isLocked = false; 
                    } else {
                        if (currentSave.cleared_stages && currentSave.cleared_stages.includes(prevQuestId)) {
                            isLocked = false;
                        }
                    }
                    prevQuestId = q.id;
                }

                if (isAdminMode) isLocked = false;

                const w = determineWeather(q.id);
                let badges = `<span class="badge badge-weather">${w}</span>`;
                if (q.interference) q.interference.forEach(inf => badges += ` <span class="badge badge-danger">⚠${inf}</span>`);
                
                let sMark = "";
                if (currentSave.s_ranks.includes(q.id)) {
                    sMark = `<span class="badge badge-s">S</span>`;
                } else if (currentSave.cleared_stages && currentSave.cleared_stages.includes(q.id)) {
                    sMark = `<span class="badge badge-clear">済</span>`;
                }

                let sCondHTML = "";
                if (q.s_cond) {
                    const hasCondChar = ownedKeys.includes(q.s_cond);
                    const colorClass = hasCondChar ? "s-cond-ok" : "";
                    sCondHTML = `<div class="s-cond">S条件: <span class="${colorClass}">${q.s_cond}</span></div>`;
                }
                if (q.region !== lastRegion) {
                    let isRegionComplete = currentSave.completed_regions.includes(q.region);
                    let completeBadge = isRegionComplete ? " <span style='color:#fd0;margin-left:5px;'>★制覇済</span>" : "";
                    const h = document.createElement('div'); h.className = 'region-header'; 
                    h.innerHTML = `■ ${q.region}${completeBadge}`;
                    list.appendChild(h); lastRegion = q.region;
                }
                
                const div = document.createElement('div'); 
                div.className = 'box stage-item'; 
                if (isLocked) div.classList.add('stage-locked');

                div.style.cssText = 'margin-bottom:8px; border:1px solid #444; padding:10px; display:flex; justify-content:space-between; align-items:center;';
                
                if (isLocked) {
                    div.innerHTML = `<div style="color:#888;">🔒 ${q.name} (未開放)</div>`;
                } else {
                    div.style.cursor = 'pointer';
                    div.innerHTML = `
                        <div>
                            <div style="font-weight:bold; color:#d4af37;">${q.name} ${sMark} <span style="font-size:0.8rem; color:#aaa;">(${q.terrain}) / ${q.food}日</span></div>
                            <div style="font-size:0.75rem; color:#ccc; margin-bottom:3px;">BOSS:<span class="r-${q.boss_r}">${q.boss_r}</span> / 敵:${q.type}</div>
                            <div class="quest-badges">${badges}</div>
                            ${sCondHTML}
                        </div>
                        <div style="font-weight:bold; font-size:1.2rem; color:#666;">▶</div>
                    `;
                    div.onclick = () => startExpedition(q);
                }
                list.appendChild(div);
            });
        } catch(e) {
            console.error(e);
            list.innerHTML = `<div style="color:red">リスト生成エラー: ${e.message}</div>`;
            document.getElementById('error-display').innerHTML += `Render Error: ${e.message}<br>`;
            document.getElementById('error-display').style.display = 'block';
        }
        
        document.getElementById('scene-select').style.display = 'block';
        document.getElementById('scene-progress').style.display = 'none';
    }

    function startExpedition(quest) {
        const tactic = document.getElementById('tactic-select').value;
        const speedEls = document.getElementsByName('march-speed');
        let speedMode = 'normal';
        for(let i=0; i<speedEls.length; i++) { if(speedEls[i].checked) speedMode = speedEls[i].value; }

        if (speedMode === 'blitz') {
            if (!confirm(`【電撃強行軍】\n兵糧を3倍消費し、敵が強化されます。\nこのモードでは撤退もできません。\n\n本当によろしいですか？`)) {
                return;
            }
        }

        if (!currentSave.last_setup) currentSave.last_setup = {};
        currentSave.last_setup.tactic = tactic;
        currentSave.last_setup.speed = speedMode;
        saveData(currentSave);

        const res = startExpeditionCore(quest.id, tactic, speedMode);
        if (res.error) { alert(res.error); return; }
        currentSave = loadSaveData();
        resumeExpedition();
    }

    function resumeExpedition(){
        document.getElementById('scene-select').style.display='none'; 
        document.getElementById('scene-progress').style.display='block';
        document.getElementById('btn-finish').style.display = 'none';
        
        const exp = currentSave.expedition;
        const isBlitz = (exp && exp.speedMode === 'blitz');
        
        document.getElementById('btn-retreat').style.display = isBlitz ? 'none' : 'block';
        document.getElementById('admin-controls').style.display = isAdminMode ? 'block' : 'none';

        const q=QUEST_DATA.find(x=>x.id===currentSave.expedition.questId);
        document.getElementById('quest-title').textContent=q.name; 
        
        let speedName = "通常進軍";
        if(exp.speedMode === 'fast') speedName = "かけあし";
        if(exp.speedMode === 'blitz') speedName = "電撃強行軍";
        document.getElementById('speed-indicator').innerHTML = `<span style="color:#aaa;">モード:</span> <span style="color:#fa8; font-weight:bold;">${speedName}</span>`;

        document.getElementById('weather-info').textContent=`天候:${currentSave.expedition.weather}`;
        lastLogIndex = 0; 
        document.getElementById('log-container').innerHTML = ''; 
        updateLogs(); 
        if(timerId) clearInterval(timerId); 
        timerId = setInterval(updateLogs, 1000);
    }
    
    function doRetreat() {
        if (confirm("本当に撤退しますか？\n(兵糧は戻りません)")) {
             cancelExpedition(); 
             currentSave = loadSaveData(); 
             updateLogs(); 
        }
    }

    function updateLogs() {
        const exp = currentSave.expedition; if (!exp) return;
        const now = Date.now();
        const q = QUEST_DATA.find(x => x.id === exp.questId);
        
        const sMode = exp.speedMode || 'normal';
        const sConf = (typeof MARCH_SPEEDS !== 'undefined') ? MARCH_SPEEDS[sMode] : { timeMod: 1.0 };
        let timeMod = sConf.timeMod;
        if (exp.tactic === "翔ぶが如く") timeMod *= 0.25;

        const totalDuration = exp.endTime - exp.startTime;
        const elapsedTime = now - exp.startTime;
        const timeLeft = exp.endTime - now;
        
        const maxDays = (exp.result === 'retired' || exp.result === 'defeat' || exp.result === 'draw') ? exp.logs.daysTraveled : q.food;
        
        let currentDay;
        if (totalDuration <= 100) {
            currentDay = maxDays; 
        } else {
            currentDay = (exp.result === 'retired') ? maxDays : Math.min(maxDays, (elapsedTime / totalDuration) * maxDays);
        }

        const logDiv = document.getElementById('log-container');
        const box = document.getElementById('battle-box');
        
        let displayedCount = 0;
        exp.logs.events.forEach((ev, idx) => {
            if (ev.day <= currentDay || (exp.result==='retired') || timeLeft <= 0) {
                if (idx >= lastLogIndex) {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    line.innerHTML = ev.text;
                    logDiv.appendChild(line);
                    logDiv.scrollTop = logDiv.scrollHeight;

                    if (ev.text.includes('ev-skill')) {
                        const matchChar = ev.text.match(/data-char="([^"]+)"/);
                        const matchSkill = ev.text.match(/data-skill="([^"]+)"/);
                        if (matchChar && matchSkill) showCutIn(matchSkill[1], matchChar[1]);
                    }
                    if (ev.text.includes('ev-fate')) {
                        const matchTitle = ev.text.match(/data-main="([^"]+)"/); 
                        const matchText = ev.text.match(/data-sub="([^"]+)"/);   
                        if (matchTitle && matchText) showCutIn(matchTitle[1], matchText[1]);
                    }
                    if (ev.text.includes('log-dmg') || ev.text.includes('ev-critical')) triggerShake(box);
                    if (ev.text.includes('flash-on-win')) triggerFlash(box);
                }
                displayedCount++;
            }
        });
        lastLogIndex = displayedCount; 

        if (timeLeft <= 0 || exp.result === 'retired') {
            let status = "到着";
            if (exp.result === 'retired') status = "撤退";
            if (exp.result === 'draw') status = "引分";
            document.getElementById('timer').textContent = status;
            document.getElementById('btn-finish').style.display = 'block';
            document.getElementById('btn-retreat').style.display = 'none';
            document.getElementById('admin-controls').style.display = 'none'; 
            clearInterval(timerId);
        } else {
            const m = Math.floor(timeLeft / 60000);
            const s = Math.floor((timeLeft % 60000) / 1000);
            document.getElementById('timer').textContent = `残り ${m}分${s.toString().padStart(2,'0')}秒`;
        }
    }

    function triggerShake(element) {
        element.classList.remove('shake-anim'); void element.offsetWidth; element.classList.add('shake-anim');
    }
    function triggerFlash(element) {
        element.classList.remove('flash-anim'); void element.offsetWidth; element.classList.add('flash-anim');
    }
    function showCutIn(mainText, subText) {
        const overlay = document.getElementById('cut-in-overlay');
        document.getElementById('cut-in-text').textContent = mainText;
        document.getElementById('cut-in-sub').textContent = subText;
        overlay.style.display = 'flex';
        overlay.classList.remove('cut-in-active'); void overlay.offsetWidth; overlay.classList.add('cut-in-active');
        setTimeout(() => { overlay.style.display = 'none'; }, 2500);
    }

    function finishExpedition() {
        const exp = currentSave.expedition; if (!exp) return;
        const q = QUEST_DATA.find(x => x.id === exp.questId);
        
        if (!currentSave.records) currentSave.records = {};
        currentSave.records.totalBattles = (currentSave.records.totalBattles || 0) + 1;
        currentSave.records.totalDistance = (currentSave.records.totalDistance || 0) + exp.logs.daysTraveled;
        currentSave.records.totalDead = (currentSave.records.totalDead || 0) + exp.stats.dead;
        
        if (exp.captured) {
            exp.captured.forEach(id => currentSave.prisoners.push({ id: id, time: Date.now() }));
            currentSave.records.capturedCount = (currentSave.records.capturedCount || 0) + exp.captured.length;
        }

        let gainedTreasures = [];
        if (exp.treasures && exp.treasures.length > 0) {
            exp.treasures.forEach(tid => {
                if (!currentSave.collected_treasures.includes(tid)) {
                    currentSave.collected_treasures.push(tid);
                    const t = TREASURE_DATA.find(x=>x.id===tid);
                    gainedTreasures.push(t.name);
                } else {
                    currentSave.money += 50;
                }
            });
        }

        let msg = ""; let rank = "D";
        if (exp.result === 'win') {
            if (!currentSave.cleared_stages.includes(q.id)) {
                currentSave.cleared_stages.push(q.id);
            }

            currentSave.records.totalWins = (currentSave.records.totalWins || 0) + 1;
            currentSave.records.winStreak = (currentSave.records.winStreak || 0) + 1;
            const bossChar = getCharacterById(exp.bossId);
            if(bossChar) currentSave.records.lastDefeatedBoss = bossChar.name;

            const deck = currentSave.deck.map(id => getCharacterById(id));
            let condMet = true; if (q.s_cond) { condMet = deck.some(c => c && (c.rarity + c.name) === q.s_cond); }
            if (exp.stats.dead > 0) rank = "B"; else if (exp.stats.hpRate < 0.7) rank = "C"; else if (!condMet) rank = "A"; else rank = "S";
            currentSave.money += q.money;
            msg = `【戦闘結果: 勝利！】\n評価: ${rank}ランク\n報酬: ${q.money}銭\n`;
            if (rank === "S") {
                if (!currentSave.s_ranks.includes(q.id)) {
                    currentSave.s_ranks.push(q.id);
                    currentSave.items.kokoro = (currentSave.items.kokoro || 0) + 1;
                    msg += `\n✨【初回S達成】貴重品「ココロの鍵」を獲得！✨\n`;
                    if (q.s_reward_char) {
                        const rewardChar = findCharacterByNameAndRarity(q.s_reward_char);
                        if (rewardChar) {
                            if (currentSave.owned_ids.includes(rewardChar.id)) {
                                const refund = 100; currentSave.money += refund;
                                msg += `\n★次への鍵【${rewardChar.name}】は所持済みのため、銀貨${refund}枚になりました★\n`;
                            } else {
                                currentSave.owned_ids.push(rewardChar.id);
                                msg += `\n★次への鍵【${rewardChar.name}】が仲間になりました！(所持枠へ)★\n`;
                            }
                        }
                    }
                    if (Math.random() < 0.1) {
                         const rareT = TREASURE_DATA.filter(t => t.rank >= 8);
                         const getT = rareT[Math.floor(Math.random() * rareT.length)];
                         if (!currentSave.collected_treasures.includes(getT.id)) {
                             currentSave.collected_treasures.push(getT.id);
                             gainedTreasures.push(getT.name + "(S報酬)");
                         }
                    }

                    const regionQuests = QUEST_DATA.filter(qu => qu.region === q.region);
                    const allS = regionQuests.every(qu => currentSave.s_ranks.includes(qu.id));
                    if (allS && !currentSave.completed_regions.includes(q.region)) {
                        currentSave.completed_regions.push(q.region);
                        msg += `\n★★★ ${q.region}を完全制覇しました！ ★★★\n`;
                        if (typeof REGION_REWARDS !== 'undefined' && REGION_REWARDS[q.region]) {
                            const rewardDef = REGION_REWARDS[q.region];
                            const rewardChar = window.characterData.find(c => c.name === rewardDef.name && c.rarity === rewardDef.rarity);
                            if (rewardChar) {
                                if (currentSave.owned_ids.includes(rewardChar.id)) {
                                    currentSave.money += 300;
                                    msg += `制覇報酬:【${rewardChar.name}】(所持済)→銀貨300枚\n`;
                                } else {
                                    currentSave.owned_ids.push(rewardChar.id);
                                    msg += `制覇報酬:【${rewardChar.name}】が仲間になりました！\n`;
                                }
                            }
                        }
                    }
                } else {
                    msg += `(Sランク済ボーナス +100銭)\n`; currentSave.money += 100;
                    const keyRate = 10 + (q.diff * 2);
                    if (Math.random() * 100 < keyRate) { currentSave.items.kokoro = (currentSave.items.kokoro || 0) + 1; msg += `\n✨「ココロの鍵」をドロップしました！✨\n`; }
                }
            } else {
                if (q.s_cond && !condMet) msg += `\n[Hint] S評価には ${q.s_cond} が必要です\n`;
                if (exp.stats.dead > 0) msg += `\n[Hint] 撤退者を出さずに勝利せよ\n`;
            }
            const tacticObj = exp.tactic ? TACTICS_DATA.find(t=>t.name===exp.tactic) : null;
            const rate = calculateCaptureProb(currentSave.deck.map(id=>getCharacterById(id)), q.boss_r, tacticObj);
            if (Math.random() * 100 < rate) { 
                currentSave.prisoners.push({ id: exp.bossId, time: Date.now() }); 
                currentSave.records.capturedCount = (currentSave.records.capturedCount || 0) + 1;
                msg += `\n敵大将を捕縛しました！`; 
            }
        } else { 
            currentSave.records.winStreak = 0;
            if (exp.result === 'retired') {
                msg = "【撤退完了】\n軍を退きました。"; 
            } else if (exp.result === 'draw') {
                msg = "【時間切れ】\n決着がつかず引き分けとなりました。\n(戦利品なし)";
            } else {
                msg = "【戦闘結果: 敗北...】\n評価: Dランク\n戦利品はありません。";
            }
        }
        
        if (gainedTreasures.length > 0) {
            msg += `\n\n🎁 家宝獲得！\n${gainedTreasures.join("\n")}`;
        }

        currentSave.expedition = null; 
        
        checkAchievements(currentSave);
        saveData(currentSave); 
        
        alert(msg); 
        updateResourceDisplay(); renderQuestList(); renderTacticSelect(); renderPrisoners(); updateSpeedDesc();
    }

            currentSave.records.totalReleased = (currentSave.records.totalReleased || 0) + 1;

            saveData(currentSave); updateResourceDisplay(); closeModal(); renderPrisoners(); alert("解放しました");
        }
    }
